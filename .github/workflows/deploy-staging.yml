name: Deploy staging

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA currently at main, for the temporary self-hosted fallback
        required: true
        type: string
      skip_novosibirsk:
        description: Skip only the Novosibirsk edge while its maintenance is declared
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

concurrency:
  group: hs-manacost-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, hs-manacost-production]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
          clean: true

      - name: Verify authorized revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            test "$REQUESTED_SHA" = "$(git rev-parse origin/main)"
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Install frontend build dependencies
        run: npm ci --ignore-scripts
      - name: Install reader test dependencies
        run: npm ci --prefix services/reader --ignore-scripts
      - name: Run quality gate
        run: make check

      - name: Verify authorized deployment helper
        run: cmp --silent ops/ci/hs-manacost-ci-deploy /usr/local/sbin/hs-manacost-ci-deploy

      - name: Deploy isolated staging
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }}
        run: sudo /usr/local/sbin/hs-manacost-ci-deploy staging "$DEPLOY_SHA" "$GITHUB_WORKSPACE"

      - name: Verify staging and available RU proxies
        env:
          MANACOST_SKIP_NOVOSIBIRSK: ${{ inputs.skip_novosibirsk || false }}
        run: ./ops/smoke-check.sh staging

      - name: Record successful staging deployment
        uses: actions/github-script@v8
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }}
          STAGING_DESCRIPTION: ${{ inputs.skip_novosibirsk && 'Verified on staging, origin and Moscow; Novosibirsk maintenance' || 'Verified on test.hs-manacost.ru and both RU proxies' }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.DEPLOY_SHA,
              environment: 'staging',
              auto_merge: false,
              required_contexts: [],
              description: process.env.STAGING_DESCRIPTION,
              transient_environment: false,
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'staging',
              environment_url: 'https://test.hs-manacost.ru',
              description: process.env.STAGING_DESCRIPTION,
            });
