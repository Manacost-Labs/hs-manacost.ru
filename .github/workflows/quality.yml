name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Install locked PHP quality tools
        run: composer install --no-interaction --prefer-dist
      - name: Check first-party WordPress code quality
        env:
          CODE_QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make code-quality
      - name: Check repository
        run: make check

  wordpress-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test package
        run: npm ci
      - name: Run isolated WordPress behaviour and visual regression tests
        env:
          RUN_VISUAL: '1'
        run: ops/integration/run.sh
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
