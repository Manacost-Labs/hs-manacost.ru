name: Admin performance staging

on:
  workflow_run:
    workflows: [Deploy staging]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hs-manacost-admin-performance-staging-${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
  cancel-in-progress: false

jobs:
  measure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, hs-manacost-production]
    timeout-minutes: 30
    environment: staging
    env:
      WP_TEST_BASE_URL: https://test.hs-manacost.ru
      HS_ADMIN_PERF_ENVIRONMENT: staging
      HS_ADMIN_PERF_CACHE_STATE: warm
      HS_ADMIN_PERF_EXTRA_SCREENS: '1'
      PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
      PLAYWRIGHT_HOST_RESOLVER_RULES: MAP test.hs-manacost.ru 151.80.21.140
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check protected staging measurement credentials
        id: credentials
        shell: bash
        env:
          WP_TEST_ADMIN_USER: ${{ secrets.STAGING_DIAGNOSTIC_USER }}
          WP_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_DIAGNOSTIC_PASSWORD }}
          STAGING_HTTP_USER: ${{ secrets.STAGING_HTTP_USER }}
          STAGING_HTTP_PASSWORD: ${{ secrets.STAGING_HTTP_PASSWORD }}
        run: |
          if [[ -n "$WP_TEST_ADMIN_USER" && -n "$WP_TEST_ADMIN_PASSWORD" && -n "$STAGING_HTTP_USER" && -n "$STAGING_HTTP_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: staging admin performance requires all four protected staging secrets; no measurement was performed.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Staging performance credentials are incomplete. Configure the four protected staging secrets before retrying.'
            exit 1
          fi
      - name: Install locked browser package
        run: npm ci --ignore-scripts
      - name: Verify article cards against live staging catalogs
        env:
          WP_TEST_ADMIN_USER: ${{ secrets.STAGING_DIAGNOSTIC_USER }}
          WP_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_DIAGNOSTIC_PASSWORD }}
          STAGING_HTTP_USER: ${{ secrets.STAGING_HTTP_USER }}
          STAGING_HTTP_PASSWORD: ${{ secrets.STAGING_HTTP_PASSWORD }}
        run: |
          docker_command=(docker)
          if ! docker info >/dev/null 2>&1; then
            docker_command=(sudo -n '--preserve-env=WP_TEST_BASE_URL,WP_TEST_ADMIN_USER,WP_TEST_ADMIN_PASSWORD,STAGING_HTTP_USER,STAGING_HTTP_PASSWORD,PLAYWRIGHT_HOST_RESOLVER_RULES' docker)
          fi
          # Keep Chromium inside its own network namespace: host interface
          # changes must not interrupt an otherwise healthy staging request.
          "${docker_command[@]}" run --rm --ipc=host --cpus=1 --memory=1g --pids-limit=256 \
            --env WP_TEST_BASE_URL --env WP_TEST_ADMIN_USER --env WP_TEST_ADMIN_PASSWORD \
            --env STAGING_HTTP_USER --env STAGING_HTTP_PASSWORD --env PLAYWRIGHT_HOST_RESOLVER_RULES \
            -v "$PWD:/work" -w /work \
            'mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e' \
            node tests/article-cards/staging.mjs
      - name: Upload article cards staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-cards-staging
          path: .artifacts/article-cards/staging-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect five comparable warm staging samples
        if: steps.credentials.outputs.enabled == 'true'
        env:
          WP_TEST_ADMIN_USER: ${{ secrets.STAGING_DIAGNOSTIC_USER }}
          WP_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_DIAGNOSTIC_PASSWORD }}
          STAGING_HTTP_USER: ${{ secrets.STAGING_HTTP_USER }}
          STAGING_HTTP_PASSWORD: ${{ secrets.STAGING_HTTP_PASSWORD }}
        run: |
          mkdir -p .artifacts/admin-performance/raw .artifacts/admin-performance/reports
          test -x "$PLAYWRIGHT_EXECUTABLE_PATH"
          node ops/performance/collect-admin-performance.mjs .artifacts/admin-performance/raw
          evaluation_failed=0
          for raw_report in .artifacts/admin-performance/raw/*.json; do
            report_path=".artifacts/admin-performance/reports/$(basename "$raw_report")"
            if [[ "$(basename "$raw_report")" == diagnostic-* ]]; then
              cp "$raw_report" "$report_path"
              continue
            fi
            ops/performance/build-admin-performance-report.py \
              "$raw_report" config/admin-performance-budgets.json > "$report_path"
            .agents/skills/wordpress-admin-performance/scripts/evaluate_admin_performance.py \
              "$report_path" || evaluation_failed=1
          done
          exit "$evaluation_failed"
      - name: Verify five cold slow-mobile frontend samples per route
        if: always() && steps.credentials.outputs.enabled == 'true'
        env:
          STAGING_HTTP_USER: ${{ secrets.STAGING_HTTP_USER }}
          STAGING_HTTP_PASSWORD: ${{ secrets.STAGING_HTTP_PASSWORD }}
        run: node ops/performance/collect-frontend-performance.mjs .artifacts/admin-performance/reports
      - name: Diagnose authenticated article save
        if: always() && steps.credentials.outputs.enabled == 'true'
        env:
          WP_TEST_ADMIN_USER: ${{ secrets.STAGING_DIAGNOSTIC_USER }}
          WP_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_DIAGNOSTIC_PASSWORD }}
          STAGING_HTTP_USER: ${{ secrets.STAGING_HTTP_USER }}
          STAGING_HTTP_PASSWORD: ${{ secrets.STAGING_HTTP_PASSWORD }}
        run: node ops/performance/diagnose-article-save.mjs .artifacts/admin-performance/reports
      - name: Diagnose authenticated image uploads
        if: always() && steps.credentials.outputs.enabled == 'true'
        env:
          WP_TEST_ADMIN_USER: ${{ secrets.STAGING_DIAGNOSTIC_USER }}
          WP_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_DIAGNOSTIC_PASSWORD }}
          STAGING_HTTP_USER: ${{ secrets.STAGING_HTTP_USER }}
          STAGING_HTTP_PASSWORD: ${{ secrets.STAGING_HTTP_PASSWORD }}
        run: node ops/performance/diagnose-media-upload.mjs .artifacts/admin-performance/reports
      - name: Upload staging performance evidence
        if: always() && steps.credentials.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: admin-performance-staging
          path: .artifacts/admin-performance/reports/
          if-no-files-found: error
          retention-days: 30
