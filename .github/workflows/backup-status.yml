name: Backup verification status

on:
  schedule:
    - cron: '17 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, hs-manacost-production]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify backup and restore-drill freshness
        run: ops/backup/audit-status.sh
