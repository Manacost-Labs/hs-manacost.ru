deptrac:
  paths:
    - ../wordpress/mu-plugins
    - ../wordpress/plugins
    - ../wordpress/themes
  layers:
    - name: FirstParty
      collectors:
        - type: bool
          must:
            - type: directory
              value: wordpress/mu-plugins/.*
          must_not:
            - type: directory
              value: wordpress/mu-plugins/(manacost-social-links|hs-manacost-newspaper-trim)\.php
    # These two adapters intentionally integrate the installed Newspaper API.
    - name: NewspaperAdapters
      collectors:
        - type: directory
          value: wordpress/mu-plugins/(manacost-social-links|hs-manacost-newspaper-trim)\.php
    - name: VendorPlugins
      collectors:
        - type: bool
          must:
            - type: directory
              value: wordpress/plugins/.*
          must_not:
            - type: directory
              value: wordpress/plugins/hs-tooltip/includes/koloda\.php
    # This adapter consumes the shared public-data client and legacy tooltip helpers.
    - name: TooltipKolodaAdapter
      collectors:
        - type: directory
          value: wordpress/plugins/hs-tooltip/includes/koloda\.php
    - name: VendorThemes
      collectors:
        - type: directory
          value: wordpress/themes/.*
  ruleset:
    FirstParty: []
    NewspaperAdapters: [VendorPlugins, VendorThemes]
    VendorPlugins: [VendorPlugins, VendorThemes]
    TooltipKolodaAdapter: [FirstParty, VendorPlugins]
    VendorThemes: [VendorThemes, VendorPlugins]
