server {
    listen 151.80.21.140:80;
    listen [2001:41d0:c:c8c::]:80;
    server_name v2.hs-manacost.ru;

    access_log /var/www/httpd-logs/v2.hs-manacost.ru.access.log;
    error_log /var/www/httpd-logs/v2.hs-manacost.ru.error.log notice;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    http2 on;
    server_name v2.hs-manacost.ru;

    ssl_certificate /etc/letsencrypt/live/v2.hs-manacost.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2.hs-manacost.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/www/httpd-logs/v2.hs-manacost.ru.access.log;
    error_log /var/www/httpd-logs/v2.hs-manacost.ru.error.log notice;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
}
