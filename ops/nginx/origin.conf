server {
	server_name hs-manacost.ru www.hs-manacost.ru;
	charset off;
	index index.php index.html;
	disable_symlinks if_not_owner from=$root_path;
	include /etc/nginx/vhosts-includes/*.conf;
	include /etc/nginx/vhosts-resources/hs-manacost.ru/*.conf;
	include /etc/nginx/users-resources/koloda/*.conf;
	access_log /var/www/httpd-logs/hs-manacost.ru.access.log;
	access_log /var/www/httpd-logs/hs-manacost.ru.timing.access.log hs_manacost_timing if=$wp_admin_timing_loggable;
	error_log /var/www/httpd-logs/hs-manacost.ru.error.log notice;
	if ($host = www.hs-manacost.ru) {
		return 301 https://hs-manacost.ru$request_uri;
	}
	return 301 https://hs-manacost.ru$request_uri;
	set $root_path /var/www/koloda/data/www/hs-manacost.ru;
	root $root_path;
	location / {
		location ~ [^/]\.ph(p\d*|tml)$ {
			try_files /does_not_exists @php;
		}
		try_files $uri $uri/ /index.php?$args;
	}
	location @php {
		include /etc/nginx/vhosts-resources/hs-manacost.ru/dynamic/*.conf;
		fastcgi_index index.php;
		fastcgi_param PHP_ADMIN_VALUE "sendmail_path = /usr/sbin/sendmail -t -i -f webmaster@hs-manacost.ru";
		fastcgi_pass unix:/var/www/php-fpm/hs-manacost-php84.sock;
		fastcgi_split_path_info ^((?U).+\.ph(?:p\d*|tml))(/?.+)$;
		try_files $uri =404;
		include fastcgi_params;
	}
	listen 151.80.21.140:80;
	gzip on;
	gzip_comp_level 1;
	gzip_disable "msie6";
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;
}
server {
	server_name hs-manacost.ru www.hs-manacost.ru;
	ssl_certificate "/var/www/httpd-cert/koloda/hs-manacost.ru.crt";
	ssl_certificate_key "/var/www/httpd-cert/koloda/hs-manacost.ru.key";
	ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
	ssl_prefer_server_ciphers on;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_dhparam /etc/ssl/certs/dhparam4096.pem;
	charset off;
	index index.php index.html;
	disable_symlinks if_not_owner from=$root_path;
	include /etc/nginx/vhosts-includes/*.conf;
	include /etc/nginx/vhosts-resources/hs-manacost.ru/*.conf;
	include /etc/nginx/users-resources/koloda/*.conf;
	access_log /var/www/httpd-logs/hs-manacost.ru.access.log;
	access_log /var/www/httpd-logs/hs-manacost.ru.timing.access.log hs_manacost_timing if=$wp_admin_timing_loggable;
	error_log /var/www/httpd-logs/hs-manacost.ru.error.log notice;
	if ($host = www.hs-manacost.ru) {
		return 301 https://hs-manacost.ru$request_uri;
	}
	set $root_path /var/www/koloda/data/www/hs-manacost.ru;
	root $root_path;
	location / {
		location ~ [^/]\.ph(p\d*|tml)$ {
			try_files /does_not_exists @php;
		}
		try_files $uri $uri/ /index.php?$args;
	}
	location @php {
		include /etc/nginx/vhosts-resources/hs-manacost.ru/dynamic/*.conf;
		fastcgi_index index.php;
		fastcgi_param PHP_ADMIN_VALUE "sendmail_path = /usr/sbin/sendmail -t -i -f webmaster@hs-manacost.ru";
		fastcgi_pass unix:/var/www/php-fpm/hs-manacost-php84.sock;
		fastcgi_split_path_info ^((?U).+\.ph(?:p\d*|tml))(/?.+)$;
		try_files $uri =404;
		include fastcgi_params;
	}
	listen 151.80.21.140:443 ssl;
	gzip on;
	gzip_comp_level 1;
	gzip_disable "msie6";
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;
}
