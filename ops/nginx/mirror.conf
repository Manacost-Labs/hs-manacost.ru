server {
	server_name hs-manacost.com www.hs-manacost.com;
	# BEGIN MIRROR RESPONSE POLICY
	# nginx >= 1.29.3: nested asset/error locations must retain the host policy.
	add_header_inherit merge;
	add_header X-Robots-Tag "noindex, follow" always;
	add_header X-Manacost-Mirror "active" always;
	fastcgi_hide_header X-Manacost-Mirror;
	# END MIRROR RESPONSE POLICY
	charset off;
	index index.php index.html;
	disable_symlinks if_not_owner from=$root_path;
	include /etc/nginx/vhosts-includes/*.conf;
	include /etc/nginx/vhosts-resources/hs-manacost.ru/*.conf;
	include /etc/nginx/users-resources/koloda/*.conf;
	access_log /var/www/httpd-logs/hs-manacost.com.access.log;
	error_log /var/www/httpd-logs/hs-manacost.com.error.log notice;

	if ($host = www.hs-manacost.com) {
		return 301 https://hs-manacost.com$request_uri;
	}

	return 301 https://hs-manacost.com$request_uri;

	set $root_path /var/www/koloda/data/www/hs-manacost.ru;
	root $root_path;

	location / {
		location ~ [^/]\.ph(p\d*|tml)$ {
			try_files /does_not_exists @php;
		}
		try_files $uri $uri/ /index.php?$args;
	}

	location @php {
		include /etc/nginx/vhosts-resources/hs-manacost.ru/dynamic/*.conf;
		fastcgi_index index.php;
		fastcgi_param PHP_ADMIN_VALUE "sendmail_path = /usr/sbin/sendmail -t -i -f webmaster@hs-manacost.ru";
		fastcgi_pass unix:/var/www/php-fpm/hs-manacost-php84.sock;
		fastcgi_split_path_info ^((?U).+\.ph(?:p\d*|tml))(/?.+)$;
		try_files $uri =404;
		include fastcgi_params;
	}

	listen 151.80.21.140:80;
	gzip on;
	gzip_comp_level 1;
	gzip_disable "msie6";
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;
}

server {
	server_name hs-manacost.com www.hs-manacost.com;
	# BEGIN MIRROR RESPONSE POLICY
	# nginx >= 1.29.3: nested asset/error locations must retain the host policy.
	add_header_inherit merge;
	add_header X-Robots-Tag "noindex, follow" always;
	add_header X-Manacost-Mirror "active" always;
	fastcgi_hide_header X-Manacost-Mirror;
	# END MIRROR RESPONSE POLICY
	ssl_certificate /etc/letsencrypt/live/hs-manacost.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/hs-manacost.com/privkey.pem;
	ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
	ssl_prefer_server_ciphers on;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_dhparam /etc/ssl/certs/dhparam4096.pem;
	charset off;
	index index.php index.html;
	disable_symlinks if_not_owner from=$root_path;
	include /etc/nginx/vhosts-includes/*.conf;
	include /etc/nginx/vhosts-resources/hs-manacost.ru/*.conf;
	include /etc/nginx/users-resources/koloda/*.conf;
	access_log /var/www/httpd-logs/hs-manacost.com.access.log;
	error_log /var/www/httpd-logs/hs-manacost.com.error.log notice;

	if ($host = www.hs-manacost.com) {
		return 301 https://hs-manacost.com$request_uri;
	}

	set $root_path /var/www/koloda/data/www/hs-manacost.ru;
	root $root_path;

	location / {
		location ~ [^/]\.ph(p\d*|tml)$ {
			try_files /does_not_exists @php;
		}
		try_files $uri $uri/ /index.php?$args;
	}

	location @php {
		include /etc/nginx/vhosts-resources/hs-manacost.ru/dynamic/*.conf;
		fastcgi_index index.php;
		fastcgi_param PHP_ADMIN_VALUE "sendmail_path = /usr/sbin/sendmail -t -i -f webmaster@hs-manacost.ru";
		fastcgi_pass unix:/var/www/php-fpm/hs-manacost-php84.sock;
		fastcgi_split_path_info ^((?U).+\.ph(?:p\d*|tml))(/?.+)$;
		try_files $uri =404;
		include fastcgi_params;
	}

	listen 151.80.21.140:443 ssl;
	gzip on;
	gzip_comp_level 1;
	gzip_disable "msie6";
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;
}
