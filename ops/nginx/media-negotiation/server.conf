# CANARY ONLY. Include before general uploads regex locations. Enabling this
# does not negotiate arbitrary old images or change explicit WebP/AVIF URLs.
# At most two bounded sidecar attempts, then the canonical local/S3 object.
location ~* ^/wp-content/uploads/2026/09/hs-media-7716-dfxxbv2-(?:staging|production)-(?:png|jpg)/.+\.(?:png|jpe?g)$ {
    set $hs_media_original_uri $uri;
    include /etc/nginx/hs-media-negotiation/headers.conf;
    error_page 418 = @hs_media_webp_local;
    if ($hs_media_avif = 0) { return 418; }
    try_files $hs_media_original_uri.avif @hs_media_avif_remote;
}

location @hs_media_avif_remote {
    rewrite ^ $hs_media_original_uri.avif break;
    include /etc/nginx/hs-media-negotiation/proxy.conf;
    proxy_intercept_errors on;
    # OVH anonymous missing keys can be 403; only a sidecar failure is hidden.
    error_page 403 404 429 500 502 503 504 = @hs_media_webp_local;
}

location @hs_media_webp_local {
    include /etc/nginx/hs-media-negotiation/headers.conf;
    error_page 418 = @hs_media_original_local;
    if ($hs_media_webp = 0) { return 418; }
    try_files $hs_media_original_uri.webp @hs_media_webp_remote;
}

location @hs_media_webp_remote {
    rewrite ^ $hs_media_original_uri.webp break;
    include /etc/nginx/hs-media-negotiation/proxy.conf;
    proxy_intercept_errors on;
    error_page 403 404 429 500 502 503 504 = @hs_media_original_local;
}

location @hs_media_original_local {
    include /etc/nginx/hs-media-negotiation/headers.conf;
    try_files $hs_media_original_uri @hs_media_original_remote;
}

location @hs_media_original_remote {
    rewrite ^ $hs_media_original_uri break;
    include /etc/nginx/hs-media-negotiation/proxy.conf;
    # Do not turn a canonical permissions/storage failure into a fake success.
    proxy_intercept_errors off;
}
