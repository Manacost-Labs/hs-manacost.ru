# The destination is fixed, never derived from client input. Nginx escapes the
# rewritten URI when proxy_pass has no URI component (including spaces/UTF-8).
proxy_pass https://hs-manacost-media-3az.s3.eu-west-par.io.cloud.ovh.net;
proxy_ssl_server_name on;
proxy_ssl_name hs-manacost-media-3az.s3.eu-west-par.io.cloud.ovh.net;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host hs-manacost-media-3az.s3.eu-west-par.io.cloud.ovh.net;
proxy_set_header Connection "";
proxy_set_header Content-Length "";
proxy_connect_timeout 1s;
proxy_read_timeout 2s;
proxy_send_timeout 2s;
proxy_next_upstream off;
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Vary;
proxy_hide_header Set-Cookie;
proxy_hide_header x-amz-id-2;
proxy_hide_header x-amz-request-id;
proxy_hide_header x-amz-version-id;
include /etc/nginx/hs-media-negotiation/headers.conf;
