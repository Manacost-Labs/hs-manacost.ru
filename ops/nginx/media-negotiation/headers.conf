# Used by every branch, including errors and the original fallback. Never let
# missing sidecars or an original fallback inherit S3's year-long lifetime.
add_header Cache-Control $hs_media_cache_control always;
add_header Vary "Accept" always;
add_header X-Robots-Tag $hs_media_robots always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
recursive_error_pages on;
etag off;
if_modified_since off;
# Format negotiation must not resume bytes using another format's validator.
# Return a full 200 even for Range/If-Range; explicit sidecar URLs are unchanged.
max_ranges 0;
limit_except GET { deny all; }
