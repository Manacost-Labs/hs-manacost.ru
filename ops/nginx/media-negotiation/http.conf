# HTTP context, separate from the Koloda maps. Explicit positive support only;
# wildcard, q=0, malformed and unknown parameters conservatively use fallback.
# A contradictory duplicate q=0 wins. Wildcards do not prove decoder support.
map $http_accept $hs_media_avif {
    default 0;
    "~*(?:^|,)\s*image/avif\s*;\s*q=0(?:\.0*)?\s*(?:,|$)" 0;
    "~*(?:^|,)\s*image/avif\s*(?:;\s*q=(?:1(?:\.0{0,3})?|0\.[0-9]{1,3}))?\s*(?:,|$)" 1;
}
map $http_accept $hs_media_webp {
    default 0;
    "~*(?:^|,)\s*image/webp\s*;\s*q=0(?:\.0*)?\s*(?:,|$)" 0;
    "~*(?:^|,)\s*image/webp\s*(?:;\s*q=(?:1(?:\.0{0,3})?|0\.[0-9]{1,3}))?\s*(?:,|$)" 1;
}
map $host $hs_media_robots {
    default "";
    hs-manacost.com "noindex, follow";
    test.hs-manacost.ru "noindex, nofollow, noarchive";
}
map "$host:$status" $hs_media_cache_control {
    default "no-store";
    "~^test\.hs-manacost\.ru:" "private, no-store";
    "~:(?:200|206|304)$" "public, max-age=300";
}
