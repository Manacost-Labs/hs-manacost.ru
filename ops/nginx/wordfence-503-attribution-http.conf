# Include from Nginx's `http` context before either HS vhost is loaded.
# The dedicated log intentionally contains no client address, request path,
# query, referer, or user-agent. It is an incident-attribution signal only.

map $status $hs_manacost_5xx_loggable {
    default 0;
    ~^5 1;
}

map "$status:$host" $hs_manacost_5xx_attribution_enabled {
    default 0;
    ~^5\d\d:hs-manacost\.ru$ 1;
    ~^5\d\d:www\.hs-manacost\.ru$ 1;
}

map $uri $hs_manacost_5xx_endpoint {
    default page;
    "/wp-login.php" login;
    ~^/wp-admin(?:/|$) admin;
    ~^/wp-json(?:/|$) rest;
}

map $upstream_http_retry_after $hs_manacost_retry_after_present {
    default 1;
    "" 0;
}

log_format hs_manacost_5xx_attribution escape=json
    '{"time":"$time_iso8601",'
    '"status":$status,'
    '"endpoint":"$hs_manacost_5xx_endpoint",'
    '"upstream_status":"$upstream_status",'
    '"retry_after_present":$hs_manacost_retry_after_present}';
