# Include from Nginx's `http` context before the hs-manacost.ru vhost is loaded
# (installed as /etc/nginx/conf.d/hs-media-s3-fallback-upstream.conf).
# Connection pool for resources/00-object-storage-fallback.conf. It stays
# separate from hs_media_verified_s3, which verifies TLS against the CA bundle.
# OVH closes idle connections after 60 s, so idle ones expire earlier here.
upstream hs_media_s3_fallback {
    server hs-manacost-media-3az.s3.eu-west-par.io.cloud.ovh.net:443;
    keepalive 16;
    keepalive_timeout 20s;
}

# Explicit sidecars may be requested before the offload timer has copied them.
# Never let a temporary missing/denied object become a persistent broken image.
map "$host:$status" $hs_media_fallback_cache_control {
    default "no-store";
    "~^test\\.hs-manacost\\.ru:" "private, no-store";
    "~:(?:200|206|304)$" "public, max-age=31536000, immutable";
}
