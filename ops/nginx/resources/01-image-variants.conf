location ~* ^/wp-content/uploads/(?<koloda_upload_path>.+\.(?:gif|png|jpe?g|webp))$ {
    etag on;
    if_modified_since exact;
    add_header Pragma "public" always;
    # Missing objects must remain retryable instead of becoming year-long cached errors.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    access_log off;
    log_not_found off;

    # Object Storage contains the canonical WordPress object for this URL.
    # Filesystem-only AVIF/WebP negotiation cannot verify a remote derivative
    # and otherwise turns valid PNG/JPEG URLs into remote *.webp 404 responses.
    try_files $uri @hs_manacost_media_object_storage;
}
