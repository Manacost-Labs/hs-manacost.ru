# Cheap malformed URL guards before WordPress routing.
if ($request_uri ~* "^/%5BCDATA%5Bhttps?:") {
    return 404;
}

if ($request_uri ~* "^/\[CDATA\[https?:") {
    return 404;
}

# Some broken clients/extensions request the whole srcset candidate list as one
# image URL. Redirect that malformed URL to the first valid image candidate.
if ($request_uri ~* "^(/wp-content/uploads/[^?]+?\.(?:gif|png|jpe?g|webp))(?:%20|\s)[0-9]+w(?:%2C|,)") {
    return 301 https://$host$1;
}
