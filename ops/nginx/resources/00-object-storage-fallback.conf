# Keep WordPress URLs unchanged and use OVH only when an image is absent locally.
location @hs_manacost_media_object_storage {
    proxy_pass https://hs-manacost-media-3az.s3.eu-west-par.io.cloud.ovh.net;
    proxy_ssl_server_name on;
    proxy_ssl_name hs-manacost-media-3az.s3.eu-west-par.io.cloud.ovh.net;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host hs-manacost-media-3az.s3.eu-west-par.io.cloud.ovh.net;
    proxy_set_header Connection "";
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-version-id;

    # Do not cache S3 errors in browsers; add this header only to successful responses.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
}

location ~* ^/wp-content/uploads/.+\.(?:avif|bmp|heic|heif|ico|svg|tiff?)$ {
    log_not_found off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    try_files $uri @hs_manacost_media_object_storage;
}

location ~* ^/wp-content/uploads-webpc/.+\.(?:avif|gif|png|jpe?g|webp)$ {
    log_not_found off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    try_files $uri @hs_manacost_media_object_storage;
}
