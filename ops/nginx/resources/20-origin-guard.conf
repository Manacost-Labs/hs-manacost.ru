# Origin protection for hs-manacost.ru. The public path is DNS -> RU proxies ->
# reverse tunnel; direct external origin hits are dropped.
if ($hs_manacost_allowed_origin_source = 0) {
    return 444;
}

# Block high-rate abusive POST crawler observed in timing logs on 2026-06-19.
if ($remote_addr = 91.92.43.150) {
    return 444;
}


if ($arg_author ~ ^[0-9]+$) {
    return 404;
}

location = /wp-login.php {
    set $hs_login_probe "";
    if ($remote_addr ~ ^(194\.67\.92\.242|186\.246\.28\.244|135\.125\.171\.168)$) {
        set $hs_login_probe "${hs_login_probe}r";
    }
    if ($request_method = GET) {
        set $hs_login_probe "${hs_login_probe}g";
    }
    if ($http_referer = "") {
        set $hs_login_probe "${hs_login_probe}n";
    }
    if ($http_user_agent ~* ^curl/[0-9]) {
        set $hs_login_probe "${hs_login_probe}c";
    }
    if ($hs_login_probe = "rgnc") {
        return 200 "ok\n";
    }

    limit_req zone=hs_origin_login_post burst=2 nodelay;
    limit_req_status 429;
    include /etc/nginx/vhosts-resources/hs-manacost.ru/dynamic/*.conf;
    fastcgi_index index.php;
    fastcgi_param PHP_ADMIN_VALUE "sendmail_path = /usr/sbin/sendmail -t -i -f webmaster@hs-manacost.ru";
    fastcgi_pass unix:/var/www/php-fpm/6.sock;
    fastcgi_split_path_info ^((?U).+\.ph(?:p\d*|tml))(/?.+)$;
    try_files $uri =404;
    include fastcgi_params;
}

location = /wp-admin/admin-ajax.php {
    if ($arg_action = td_ajax_update_post_views) {
        return 204;
    }
    limit_req zone=hs_origin_ajax burst=30 nodelay;
    limit_req zone=hs_origin_imagify burst=1 nodelay;
    limit_req_status 429;
    client_body_buffer_size 16m;
    include /etc/nginx/vhosts-resources/hs-manacost.ru/dynamic/*.conf;
    fastcgi_index index.php;
    fastcgi_param PHP_ADMIN_VALUE "sendmail_path = /usr/sbin/sendmail -t -i -f webmaster@hs-manacost.ru";
    fastcgi_pass unix:/var/www/php-fpm/6.sock;
    fastcgi_split_path_info ^((?U).+\.ph(?:p\d*|tml))(/?.+)$;
    try_files $uri =404;
    include fastcgi_params;
}

location = /wp-admin/async-upload.php {
    limit_req zone=hs_origin_ajax burst=20 nodelay;
    limit_req_status 429;
    client_body_buffer_size 16m;
    include /etc/nginx/vhosts-resources/hs-manacost.ru/dynamic/*.conf;
    fastcgi_index index.php;
    fastcgi_param PHP_ADMIN_VALUE "sendmail_path = /usr/sbin/sendmail -t -i -f webmaster@hs-manacost.ru";
    fastcgi_pass unix:/var/www/php-fpm/6.sock;
    fastcgi_split_path_info ^((?U).+\.ph(?:p\d*|tml))(/?.+)$;
    try_files $uri =404;
    include fastcgi_params;
}
