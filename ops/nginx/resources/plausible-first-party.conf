# First-party Plausible proxy. Keeps analytics requests on hs-manacost.ru so
# browser privacy tools are less likely to block article pageview tracking.
location = /mca/script.js {
    proxy_pass http://127.0.0.1:8000/js/script.outbound-links.tagged-events.pageview-props.js;
    proxy_http_version 1.1;
    proxy_set_header Host stats.hs-manacost.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    access_log /var/www/httpd-logs/hs-manacost.ru.plausible.access.log;
}

location = /mca/event {
    proxy_pass http://127.0.0.1:8000/api/event;
    proxy_http_version 1.1;
    proxy_set_header Host stats.hs-manacost.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    access_log /var/www/httpd-logs/hs-manacost.ru.plausible.access.log;
}
