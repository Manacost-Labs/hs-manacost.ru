location ~* (?:^|/)(?:wp-config(?:-sample)?\.php|\.env(?:\..*)?|\.git(?:/|$)|\.svn(?:/|$)|phpinfo\.php|info\.php|debug\.log|wp-content/debug\.log|(?:backup|dump|database|db)\.sql)$ {
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    access_log off;
    log_not_found off;
    return 404;
}

# Codex cheap deny for archive/probe extensions that should never hit WordPress.
location ~* \.(?:war|ear|jar|bak|backup|old|orig|save|swp|sql|7z|zip|tar|tgz|gz|rar)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    access_log off;
    log_not_found off;
    return 404;
}
