# Production hs-manacost_origin upstream on the Novosibirsk edge only.
# Install as the upstream block in /etc/nginx/sites-enabled/hs-manacost.ru.conf.
# Direct TLS avoids head-of-line blocking on the shared reverse SSH tunnels;
# the existing tunnels remain available if the direct origin is unavailable.
# Validate with nginx -t before reloading. The pre-change block is the rollback.
upstream hs_manacost_origin {
    zone hs_manacost_origin 64k;
    server 151.80.21.140:443 max_fails=2 fail_timeout=2s;
    server 127.0.0.1:18443 max_fails=2 fail_timeout=2s backup;
    server 127.0.0.1:18444 max_fails=2 fail_timeout=2s backup;
    server 127.0.0.1:18445 max_fails=2 fail_timeout=2s backup;
    keepalive 64;
}
