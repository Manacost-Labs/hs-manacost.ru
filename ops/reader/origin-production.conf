# Include only in the canonical hs-manacost.ru HTTPS origin vhost.
# Reader traffic bypasses PHP and every page cache; do not include this twice.
location ~ ^/(?:reader-auth|reader-api)/ {
    client_max_body_size 4m;
    client_body_timeout 10s;
    proxy_request_buffering off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:18183;
    proxy_set_header Host hs-manacost.ru;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host hs-manacost.ru;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    access_log off;
}
