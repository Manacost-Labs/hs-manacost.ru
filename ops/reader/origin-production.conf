# Include only in the canonical hs-manacost.ru HTTPS origin vhost.
# Reader traffic bypasses PHP and every page cache; do not include this twice.
location ~ ^/(?:reader-auth|reader-api)/ {
    client_max_body_size 4m;
    client_body_timeout 10s;
    proxy_request_buffering off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:18183;
    proxy_set_header Host hs-manacost.ru;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host hs-manacost.ru;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    access_log off;
}

# A login that fails or expires returns to the cabinet with a readable message
# (reader.js handles ?login=failed) instead of showing raw JSON. Exact match
# wins over the regex above; success and access_denied stay 303 redirects.
location = /reader-auth/callback {
    error_log /dev/null;
    proxy_pass http://127.0.0.1:18183;
    proxy_set_header Host hs-manacost.ru;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host hs-manacost.ru;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    access_log off;
    proxy_intercept_errors on;
    error_page 400 401 403 429 500 502 503 504 =303 https://hs-manacost.ru/account/?login=failed;
}
