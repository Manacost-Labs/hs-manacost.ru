# Isolated identity host; never install this on a production hostname.
server {
    listen 151.80.21.140:80;
    server_name test.hearthpulse.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 404; }
}

server {
    listen 151.80.21.140:443 ssl;
    http2 on;
    server_name test.hearthpulse.net;

    ssl_certificate /etc/letsencrypt/live/test.hearthpulse.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.hearthpulse.net/privkey.pem;
    root /srv/hearthpulse-identity-staging/current/dist;
    index index.html;
    access_log off;
    error_log /dev/null;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~ ^/(?:wallpaper|fonts|img)/.+\.(?:webp|png|jpe?g|svg|woff2?)$ {
        try_files $uri =404;
    }

    location = /favicon.svg { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }

    location ~ ^/(?:identity/.*|api/auth/(?:me|telegram/config|login|register|verify|password-reset/request|password-reset/confirm|logout))$ {
        set $identity_method_allowed 1;
        if ($uri ~ ^/api/auth/(?:login|register|verify|password-reset/request|password-reset/confirm|logout)$) { set $identity_method_allowed 0; }
        if ($request_method = POST) { set $identity_method_allowed 1; }
        if ($identity_method_allowed = 0) { return 405; }
        proxy_pass http://127.0.0.1:18182;
        proxy_set_header Host test.hearthpulse.net;
        proxy_set_header X-Forwarded-Host test.hearthpulse.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_hide_header Cache-Control;
        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
    }

    location = / { try_files /index.html =404; }
    location = /account/ { try_files /index.html =404; }

    location /api/ { return 404; }
    location / { return 404; }
}
