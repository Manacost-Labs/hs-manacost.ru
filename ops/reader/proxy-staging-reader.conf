# Include only in the HTTPS server for test.hs-manacost.ru on both RU edges.
# Preserve the staging BasicAuth gate and forward its credentials to origin.
location ~ ^/(?:reader-auth|reader-api)/ {
    access_log off;
    error_log /dev/null;
    proxy_pass https://hs_manacost_reader_origin;
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_ssl_server_name on;
    proxy_ssl_name test.hs-manacost.ru;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_session_reuse off;
    proxy_set_header Connection close;
    proxy_set_header Host test.hs-manacost.ru;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Host test.hs-manacost.ru;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Accept-Encoding "";
}
