# Include only in the canonical hs-manacost.ru HTTPS vhost on each public edge.
# The dedicated upstream prevents verified Reader traffic reusing legacy pools.
location ~* ^/account/?$ {
    access_log off;
    error_log /dev/null;
    rewrite ^ /account/ break;
    proxy_pass https://hs_manacost_reader_production_origin;
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_ssl_server_name on;
    proxy_ssl_name hs-manacost.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/nginx/ssl/hs-manacost-reader-origin-ca.pem;
    proxy_ssl_session_reuse off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host hs-manacost.ru;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Host hs-manacost.ru;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Accept-Encoding "";
}

location ~ ^/(?:reader-auth|reader-api)/ {
    client_max_body_size 4m;
    client_body_timeout 10s;
    proxy_request_buffering off;
    access_log off;
    error_log /dev/null;
    proxy_pass https://hs_manacost_reader_production_origin;
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_ssl_server_name on;
    proxy_ssl_name hs-manacost.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    # The production origin currently uses a private self-signed certificate.
    # Install only its public certificate through the release runbook and pin
    # that trust anchor here; never fall back to the ordinary unverified pool.
    proxy_ssl_trusted_certificate /etc/nginx/ssl/hs-manacost-reader-origin-ca.pem;
    proxy_ssl_session_reuse off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host hs-manacost.ru;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Host hs-manacost.ru;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Accept-Encoding "";
}
