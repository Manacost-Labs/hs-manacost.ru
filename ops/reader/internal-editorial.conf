# Loopback-only signed editorial predicates for Reader BFF services.
# Install in the nginx http context. These are intentionally separate from
# public Reader routes: only the exact signed REST endpoints reach WordPress.
server {
    listen 127.0.0.1:18184;
    server_name _;
    root /var/www/koloda/data/www/hs-manacost.ru;
    access_log off;
    error_log /var/www/httpd-logs/hs-manacost.ru.error.log notice;

    location ~ ^/wp-json/manacost-reader/v1/(?:threads|favorites)$ {
        limit_except POST { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/hs-manacost.ru/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_HOST hs-manacost.ru;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_ORIGIN "";
        fastcgi_param HTTP_COOKIE "";
        fastcgi_param HTTP_REFERER "";
        fastcgi_param HTTP_SEC_FETCH_SITE "";
        fastcgi_param HTTPS on;
        fastcgi_cache off;
        fastcgi_connect_timeout 1s;
        fastcgi_send_timeout 2s;
        fastcgi_read_timeout 2s;
        fastcgi_pass unix:/var/www/php-fpm/hs-manacost-php84.sock;
    }

    location / { return 404; }
}

