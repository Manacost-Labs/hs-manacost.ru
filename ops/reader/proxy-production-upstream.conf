# HTTP context on every public edge; dedicated to production Reader routes.
# Revalidate all three loopback tunnels before activation.
upstream hs_manacost_reader_production_origin {
    zone hs_manacost_reader_production_origin 64k;
    server 127.0.0.1:18443 max_fails=2 fail_timeout=2s;
    server 127.0.0.1:18444 max_fails=2 fail_timeout=2s;
    server 127.0.0.1:18445 max_fails=2 fail_timeout=2s;
}
