# HTTP context on both RU edges; dedicated to the staging reader routes.
# Never add this traffic to the ordinary site's unverified keepalive pool.
upstream hs_manacost_reader_origin {
    zone hs_manacost_reader_origin 64k;
    server 127.0.0.1:18443 max_fails=2 fail_timeout=2s;
    server 127.0.0.1:18444 max_fails=2 fail_timeout=2s;
    server 127.0.0.1:18445 max_fails=2 fail_timeout=2s;
}
