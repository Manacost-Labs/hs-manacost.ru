# Opt-in HTTPS vhost snippet for hs-manacost.ru; not installed by WordPress deployment.
# Install only after Reader OAuth and the separate MCP listener pass staging checks.
location ~ ^/(?:mcp-oauth/(?:authorize|token|register|jwks|revoke)|\.well-known/oauth-authorization-server/mcp-oauth)$ {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:18183;
    proxy_set_header Host hs-manacost.ru;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Host hs-manacost.ru;
    proxy_set_header CF-Connecting-IP "";
    client_body_timeout 10s;
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    access_log off;
    error_log /dev/null;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
}
location ~ ^/(?:mcp|\.well-known/oauth-protected-resource/mcp)$ {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8792;
    proxy_set_header Host hs-manacost.ru;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-Host hs-manacost.ru;
    proxy_set_header CF-Connecting-IP "";
    client_body_timeout 10s;
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    access_log off;
    error_log /dev/null;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
}
