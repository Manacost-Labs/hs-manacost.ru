# Opt-in HTTPS vhost snippet for hs-manacost.ru on both RU edges.
# Reuse the reviewed Reader TLS upstream; expose only on this canonical/test host.
location ~ ^/(?:mcp|mcp-oauth/(?:authorize|token|register|jwks|revoke)|\.well-known/oauth-(?:protected-resource/mcp|authorization-server/mcp-oauth))$ {
    client_max_body_size 16k;
    proxy_pass https://hs_manacost_reader_production_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name hs-manacost.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/nginx/ssl/hs-manacost-reader-origin-ca.pem;
    proxy_ssl_session_reuse off;
    proxy_set_header Host hs-manacost.ru;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Host hs-manacost.ru;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header Accept-Encoding "";
    client_body_timeout 10s;
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    access_log off;
    error_log /dev/null;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
}
