# Include this exact location inside the authenticated test.hs-manacost.ru server.
# The outer auth_basic remains a staging-access gate, not a reader identity boundary:
# any valid credential in its inherited htpasswd admits this route. The route's BFF
# separately verifies its signed HMAC identity; WordPress deliberately receives
# neither staging Basic credentials nor a reader identity for application-password auth.
location = /wp-json/manacost-reader/v1/threads {
    limit_except POST {
        deny all;
    }

    if ($args != "") {
        return 400;
    }

    client_max_body_size 1k;
    client_body_timeout 3s;
    access_log off;

    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/test-hs-manacost-wordpress/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_AUTHORIZATION "";
    fastcgi_param PHP_AUTH_USER "";
    fastcgi_param PHP_AUTH_PW "";
    fastcgi_param PHP_ADMIN_VALUE "sendmail_path=/bin/false";
    fastcgi_pass unix:/var/www/php-fpm/hs-manacost-php84.sock;
    fastcgi_connect_timeout 3s;
    fastcgi_send_timeout 3s;
    fastcgi_read_timeout 3s;
    fastcgi_cache off;
    fastcgi_cache_bypass 1;
    fastcgi_no_cache 1;
}
