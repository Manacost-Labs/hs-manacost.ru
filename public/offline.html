<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#062f3b">
  <title>Нет подключения — HS Manacost</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; background: #062f3b; color: #f4fbfc; }
    main { width: min(100%, 34rem); text-align: center; }
    img { width: 128px; height: 128px; }
    h1 { margin: 24px 0 12px; font-size: clamp(1.75rem, 5vw, 2.5rem); }
    p { color: #c6e3e8; line-height: 1.6; }
    a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px; background: #72dbe8; color: #062f3b; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/pwa-icons/icon-192.png" alt="">
    <h1>Нет подключения к интернету</h1>
    <p>Проверьте соединение и попробуйте открыть HS Manacost ещё раз.</p>
    <a href="/">Повторить</a>
  </main>
</body>
</html>
